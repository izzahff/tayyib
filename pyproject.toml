[project]
name = "tayyib"
version = "0.1.0"
description = "Shariah-compliant stock screening, done properly."
readme = "README.md"
authors = [
    { name = "Izzah Farhanah Faizul", email = "izzahfarhanah77@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "polars>=1.43.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22.8",
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "typer>=0.27.1",
]

[project.scripts]
tayyib = "tayyib:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
