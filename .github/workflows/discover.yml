name: Daily discovery

# Checks which S&P 500 tickers the FMP free plan covers, a batch per day,
# and commits the updated ticker list. Once every ticker is checked, a run
# makes no FMP calls and commits nothing.

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC, 08:30 in Malaysia, after the FMP daily reset
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # 90 calls leaves room for the Monday weekly run within 250 calls a day.
      - run: uv run python scripts/discover_free_universe.py --max 90
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      - name: Commit updated ticker list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tayyib/data/free_plan_constituents.csv src/tayyib/data/free_plan_probe.json
          if git diff --cached --quiet; then
            echo "No new tickers checked."
          else
            git commit -m "Update free-plan ticker coverage"
            git push
          fi
